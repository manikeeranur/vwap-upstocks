<style>
  /* Satoshi everywhere (Fontshare); Inter as the fallback while it loads. */
  @import url("https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap");
  :root { --bg:#f0f4f8; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --accent:#4f46e5; --ce:#0284c7; --pe:#e11d48; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0f16; --card:#0f1724; --text:#e2e8f0; --muted:#94a3b8; --border:#1e2a3a; --accent:#818cf8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 'Satoshi', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  select, input[type=date] { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; text-transform: none; letter-spacing: 0; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; font-weight: 700; padding: 9px 0; border: 0; background: var(--bg); color: var(--muted); cursor: pointer; }
  .seg button.on[data-v=CE] { background: var(--ce); color: #fff; } .seg button.on[data-v=PE] { background: var(--pe); color: #fff; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
  .check { flex-direction: row; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 14px; color: var(--text); }
  .btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; } .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.exp { background: #f59e0b22; color: #b45309; } .tag.live { background: #16a34a22; color: var(--ok); }
  #out { margin-top: 16px; } .msg { color: var(--muted); } .err { color: var(--pe); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; } th { color: var(--muted); font-size: 12px; font-weight: 600; }
  .scroll { overflow-x: auto; }
  input[type=number], input[type=time], input[type=text] { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; }
  .seg button.on[data-v=strike], .seg button.on[data-v=premium] { background: var(--accent); color: #fff; }
  .pm { display: none; } body.premium-mode .pm { display: flex; }
  .found { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
  .found .near { color: var(--muted); font-size: 13px; margin-top: 4px; }
  nav { display: flex; gap: 6px; margin-bottom: 18px; }
  nav a { font-weight: 600; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
  nav a.on { color: #fff; background: var(--accent); border-color: var(--accent); }
</style>
