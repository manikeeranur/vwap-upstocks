<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>upstocks — calendar P&amp;L</title>
{% from "_icons.html" import ui_icon %}
{% include "_style.html" %}
<style>
  main { max-width: none; padding: 24px 28px 48px; }
  .broker-tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:-6px 0 18px; }
  .broker-tile { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--card); }
  .broker-tile .broker-logo { width:28px; height:28px; }
  .broker-tile span { display:block; font-size:11px; color:var(--muted); } .broker-tile b { display:block; font-size:17px; font-weight:600; margin-top:2px; }
  .broker-tile small { margin-left:auto; font-size:11px; color:var(--muted); text-align:right; }
  @media (max-width:700px) { .broker-tiles { grid-template-columns:1fr; } }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
  .head h1 { margin: 0; } .head .sub { margin: 2px 0 0; }
  .mnav { display: flex; align-items: center; gap: 8px; }
  .mnav h2 { font-size: 18px; margin: 0 6px; min-width: 150px; text-align: center; }
  .mnav button { font: inherit; font-weight: 700; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile span { display: block; font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile b { display: block; font-size: 20px; margin-top: 6px; } .tile small { color: var(--muted); font-size: 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .dow { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 4px 2px; }
  .day { min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: 10px; min-height: 92px; padding: 8px 10px; cursor: default;
         display: flex; flex-direction: column; gap: 4px; position: relative; }
  .day { font:inherit; color:var(--text); text-align:left; cursor:pointer; }
  .cal-compact { display:none; }
  @media(max-width:540px) { .cal-full { display:none; } .cal-compact { display:inline; } .tiles > :first-child { grid-column:1/-1; } }
  .day.has { cursor: pointer; } .day.has:hover { outline: 2px solid var(--accent); }
  .day.sel { outline: 2px solid var(--accent); }
  .day.out { opacity: .35; } .day.wk { background: transparent; }
  .day .n { font-size: 12px; color: var(--muted); font-weight: 600; }
  .day .pl { font-size: 16px; font-weight: 700; margin-top: auto; }
  .day .tc { font-size: 11px; color: var(--muted); }
  .day.today .n { color: var(--accent); }
  .up { color: var(--ok); } .down { color: var(--pe); } .muted { color: var(--muted); }
  .st { font-weight: 700; } .st.SL { color: var(--pe); } .st.TARGET { color: var(--ok); }
  #detail { margin-top: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  @media (max-width: 700px) {
    main { padding: 16px 12px 40px; }
    .card { padding: 10px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile b { font-size: 17px; }
    .day { min-height: 60px; padding: 5px 4px; border-radius: 7px; }
    .day .pl { font-size: 10.5px; white-space: nowrap; letter-spacing: -.2px; }
    .day .tc { font-size: 9.5px; white-space: nowrap; }
    .cal { gap: 4px; } .dow { font-size: 9.5px; padding: 0 2px; letter-spacing: .4px; }
  }
</style>
</head>
<body>
{% set active = "calendar" %}{% include "_nav.html" %}
<main id="main" tabindex="-1">
  <div class="head">
    <div><h1>P&amp;L calendar</h1><p class="sub">Daily performance, one month at a time.</p></div>
    <span style="flex:1"></span>
    <label>Strategy <select id="strat"><option value="">All strategies</option>
      {% for p in presets %}<option value="{{ p }}">{{ {"ema25_vwap":"VWAP + EMA25","ema_pullback":"EMA pullback","smc_ema_combo":"SMC + EMA (1/day)"}.get(p, labels[p]) }}</option>{% endfor %}</select></label>
    <label>Mode <select id="mode">
      <option value="paper">Paper</option>
      <option value="live">Live · all brokers</option>
      <option value="live:upstox">Live · Upstox</option>
      <option value="live:kite">Live · Kite</option>
      <option value="live:indmoney">Live · INDmoney</option>
    </select></label>
    <div class="mnav"><button id="prev" type="button" aria-label="Previous month">‹</button><h2 id="mon"></h2><button id="next" type="button" aria-label="Next month">›</button></div>
  </div>
  <p class="page-status" id="pageStatus" role="status">Loading your calendar…</p>
  <div class="tiles" id="tiles"></div>
  <div class="broker-tiles" id="brokerTiles" hidden></div>
  <div class="card">
    <div class="cal" id="cal"></div>
  </div>
  <div class="card" id="detail" hidden></div>
</main>
<script>
const $ = id => document.getElementById(id);
const LABELS = { ...{{ labels | tojson }}, ema25_vwap: "VWAP + EMA25", ema_pullback: "EMA pullback", smc_ema_combo: "SMC + EMA (1/day)" }, TODAY = "{{ today }}";
const fmt = n => (Math.round(n * 100) / 100).toFixed(2);
const money = n => `${n < 0 ? "−" : n > 0 ? "+" : ""}₹${Math.abs(Math.round(n)).toLocaleString("en-IN")}`;
const ampm = s => { if (!s) return "—"; let [h, m] = s.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; };
const iso = d => d.toLocaleDateString("en-CA");
let cur = new Date(TODAY); cur.setDate(1);
let J = null, sel = null, loadVersion = 0;
const mode = () => $("mode").value;   // "paper", "live" or "live:<broker>"
const BROKERS = { upstox: "Upstox", kite: "Kite", indmoney: "INDmoney" };
// Paper: every trade at the journal's quantity. Live: only trades a broker bought, at the quantity sent
// (summed across the chosen brokers), priced at the strategy's entry/exit.
// Same formula as the Strategy backtest page, used only when the broker's own charges aren't known.
function estCharges(entry, exit, qty) {
  const turnover = (entry + exit) * qty, brokerage = 40;
  const stt = exit * qty * 0.000625, exchange = turnover * 0.00053, clearing = turnover * 0.00003;
  const gst = (brokerage + exchange + clearing) * 0.18, sebi = turnover * 0.000001, stamp = entry * qty * 0.00003;
  return brokerage + stt + exchange + clearing + gst + sebi + stamp;
}
const liveOf = t => {
  const want = mode().split(":")[1];
  const acc = Object.entries(J.live?.[t.id] || {}).filter(([a]) => !want || a.split(":")[1] === want);
  return acc.length ? Object.fromEntries(acc) : null;
};

async function load() {
  const version = ++loadVersion;
  const a = new Date(cur.getFullYear(), cur.getMonth(), 1), b = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  const status = $("pageStatus"); status.hidden = false; status.className = "page-status"; status.textContent = "Loading your calendar…";
  $("cal").setAttribute("aria-busy", "true");
  try {
    const response = await appFetch(`/api/journal?start=${iso(a)}&end=${iso(b)}`);
    if (!response.ok) throw new Error("Couldn't load the calendar. Change the month to try again.");
    const result = await response.json(); if (version !== loadVersion) return;
    J = result; status.hidden = true; render();
  } catch (error) {
    if (version !== loadVersion) return;
    J = null; $("cal").innerHTML = ""; $("tiles").innerHTML = ""; $("detail").hidden = true;
    status.className = "page-status error"; status.textContent = error.message;
  } finally { if (version === loadVersion) $("cal").setAttribute("aria-busy", "false"); }
}

function dayTrades(d) {
  const out = [];
  for (const [p, v] of Object.entries(J.days[d] || {})) {
    if ($("strat").value && p !== $("strat").value) continue;
    v.trades.forEach(t => {
      if (mode() === "paper") { out.push({ ...t, preset: p, rs: t.pnl * v.lots * v.lot_size }); return; }
      const acc = liveOf(t); if (!acc) return;
      // Real P&L from the broker's fill prices; strategy prices only until the fills are known (marked est.).
      const byBroker = Object.fromEntries(Object.entries(acc).map(([a, o]) => {
        const real = o.buy != null && o.sell != null, gross = real ? (o.sell - o.buy) * o.qty : t.pnl * o.qty;
        const realCh = o.buy_charges != null && o.sell_charges != null;
        const ch = realCh ? o.buy_charges + o.sell_charges : estCharges(o.buy ?? t.entry, o.sell ?? t.exit, o.qty);
        return [a.split(":")[1], {qty: o.qty, real, realCh, buy: o.buy, sell: o.sell, gross, ch, rs: gross - ch}];
      }));
      const parts = Object.values(byBroker), qty = parts.reduce((a, x) => a + x.qty, 0);
      const gross = parts.reduce((a, x) => a + x.gross, 0), ch = parts.reduce((a, x) => a + x.ch, 0);
      // In live mode the day's figure is net of charges.
      out.push({ ...t, preset: p, rs: gross - ch, gross, ch, chEst: parts.some(x => !x.realCh), qty, byBroker, estimated: parts.some(x => !x.real),
                 brokers: Object.entries(byBroker).map(([b, x]) => `${BROKERS[b] || b} · ${x.qty} qty${x.real ? ` · ₹${fmt(x.buy)} → ₹${fmt(x.sell)}` : " · est."}`).join("<br>") });
    });
  }
  return out.sort((a, b) => a.entry_time.localeCompare(b.entry_time));
}

function render() {
  if (!J) return;
  $("mon").textContent = cur.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  const y = cur.getFullYear(), m = cur.getMonth(), first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const lead = (first.getDay() + 6) % 7;  // Monday first
  const pl = {}; let maxAbs = 1;
  for (let d = 1; d <= last.getDate(); d++) {
    const k = iso(new Date(y, m, d)), ts = dayTrades(k);
    if (ts.length || J.days[k]) { pl[k] = { rs: ts.reduce((a, t) => a + t.rs, 0), n: ts.length }; maxAbs = Math.max(maxAbs, Math.abs(pl[k].rs)); }
  }
  const vals = Object.entries(pl).filter(([, v]) => v.n);
  const net = vals.reduce((a, [, v]) => a + v.rs, 0), green = vals.filter(([, v]) => v.rs > 0).length, red = vals.filter(([, v]) => v.rs < 0).length;
  const best = vals.reduce((a, d) => !a || d[1].rs > a[1].rs ? d : a, null), worst = vals.reduce((a, d) => !a || d[1].rs < a[1].rs ? d : a, null);
  const tile = (k, v, s = "", cls = "") => `<div class="tile"><span>${k}</span><b class="${cls}">${v}</b><small>${s}</small></div>`;
  // Live, all brokers: the month split by broker.
  const showBrokers = mode() === "live";
  $("brokerTiles").hidden = !showBrokers;
  if (showBrokers) {
    const per = {}; for (const b of Object.keys(BROKERS)) per[b] = {gross: 0, rs: 0, n: 0};
    for (let d = 1; d <= last.getDate(); d++) for (const t of dayTrades(iso(new Date(y, m, d))))
      for (const [b, x] of Object.entries(t.byBroker || {})) { per[b].gross += x.gross; per[b].rs += x.rs; per[b].n++; }
    $("brokerTiles").innerHTML = Object.entries(per).map(([b, x]) => `<div class="broker-tile">${window.brokerLogo ? brokerLogo(b, 28) : ""}<div><span>${BROKERS[b]}</span><b class="${x.n ? (x.gross >= 0 ? "up" : "down") : "muted"}">${x.n ? money(x.gross) : "—"}</b></div><small>${x.n} ${x.n === 1 ? "trade" : "trades"}${x.n ? `<br>net <b class="${x.rs >= 0 ? "up" : "down"}" style="display:inline;font-size:11px">${money(x.rs)}</b>` : ""}</small></div>`).join("");
  }
  if (mode() !== "paper") {
    let g = 0, c = 0, n = 0, est = false;
    for (let d = 1; d <= last.getDate(); d++) for (const t of dayTrades(iso(new Date(y, m, d)))) { g += t.gross; c += t.ch; n++; est ||= t.chEst; }
    $("tiles").innerHTML = [
      tile(`Gross P&L${mode().includes(":") ? " · " + BROKERS[mode().split(":")[1]] : ""}`, money(g), `${n} live ${n === 1 ? "trade" : "trades"} · real fill prices`, g >= 0 ? "up" : "down"),
      tile("Charges", money(-c), est ? "Broker charges · some estimated" : "Broker charges", "down"),
      tile("Net P&L", money(g - c), "After charges", g - c >= 0 ? "up" : "down"),
      tile("Green days", green, `of ${vals.length} traded days · net`, "up"),
      tile("Red days", red, "", "down"),
    ].join("");
  } else $("tiles").innerHTML = [
    tile(mode() === "paper" ? "Month paper P&L" : `Month live P&L${mode().includes(":") ? " · " + BROKERS[mode().split(":")[1]] : ""}`, money(net), `${vals.reduce((a, [, v]) => a + v.n, 0)} ${mode() !== "paper" ? "live " : ""}trades · gross${mode() !== "paper" ? " · real fill prices" : ""}`, net >= 0 ? "up" : "down"),
    tile("Green days", green, `of ${vals.length} traded days`, "up"),
    tile("Red days", red, "", "down"),
    tile("Best day", best ? money(best[1].rs) : "—", best ? best[0] : "", best ? (best[1].rs >= 0 ? "up" : "down") : ""),
    tile("Worst day", worst ? money(worst[1].rs) : "—", worst ? worst[0] : "", worst ? (worst[1].rs >= 0 ? "up" : "down") : ""),
  ].join("");
  const cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`);
  for (let i = 0; i < lead; i++) cells.push(`<div class="day out wk"></div>`);
  for (let d = 1; d <= last.getDate(); d++) {
    const dt = new Date(y, m, d), k = iso(dt), v = pl[k], wk = dt.getDay() === 0 || dt.getDay() === 6;
    const a = v && v.n ? Math.min(0.85, 0.12 + Math.abs(v.rs) / maxAbs * 0.5) : 0;
    const bg = v && v.n ? `background: color-mix(in srgb, ${v.rs >= 0 ? "var(--ok)" : "var(--pe)"} ${Math.round(a * 100)}%, var(--card));` : "";
    cells.push(`<button type="button" aria-label="${k}${v && v.n ? `, ${money(v.rs)}, ${v.n} trades` : ", no trades"}" aria-pressed="${k === sel}" class="day ${v && v.n ? "has" : ""} ${wk ? "wk" : ""} ${k === TODAY ? "today" : ""} ${k === sel ? "sel" : ""}" data-d="${k}" style="${bg}">
      <span class="n">${d}</span>
      ${v && v.n ? `<span class="pl ${v.rs >= 0 ? "up" : "down"}" style="${a > .45 ? "color:#fff" : ""}">${`<span class="cal-full">${money(v.rs)}</span><span class="cal-compact">${v.rs < 0 ? "−" : v.rs > 0 ? "+" : ""}₹${new Intl.NumberFormat("en-IN", {notation:"compact",maximumFractionDigits:1}).format(Math.abs(v.rs))}</span>`}</span><span class="tc" style="${a > .45 ? "color:#fffc" : ""}">${v.n} trade${v.n > 1 ? "s" : ""}</span>`
        : v ? `<span class="tc" style="margin-top:auto">no trade</span>` : ""}
    </button>`);
  }
  $("cal").innerHTML = cells.join("");
  renderDetail();
}

function renderDetail() {
  if (!sel) { $("detail").hidden = true; return; }
  const ts = dayTrades(sel), net = ts.reduce((a, t) => a + t.rs, 0);
  $("detail").hidden = false;
  $("detail").innerHTML = `<h3>${new Date(sel).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" })} · <span class="${net >= 0 ? "up" : "down"}">${money(net)}</span></h3>
    <div class="scroll"><table><thead><tr><th>Strategy</th><th>In → out</th><th>Option</th><th>Entry</th><th>Exit</th><th>Status</th><th>P&amp;L pts</th><th>P&amp;L ₹</th>${mode() !== "paper" ? "<th>Charges</th><th>Net</th><th>Live at</th>" : ""}<th>Note</th></tr></thead><tbody>${
    ts.map(t => `<tr><td>${LABELS[t.preset]}</td><td>${ampm(t.entry_time)} → ${t.open ? "…" : ampm(t.exit_time)}</td>
      <td><b style="color:${t.type === "CE" ? "var(--ce)" : "var(--pe)"}">${t.symbol}</b></td><td>₹${fmt(t.entry)}</td><td>₹${fmt(t.exit)}</td>
      <td class="st ${t.status}">${t.open ? "OPEN" : t.status === "TIME_EXIT" ? "TIME EXIT" : t.status}</td>
      <td class="${t.rs >= 0 ? "up" : "down"}">${t.pnl >= 0 ? "+" : ""}${fmt(t.pnl)}</td>${mode() !== "paper" ? `<td class="${t.gross >= 0 ? "up" : "down"}">${money(t.gross)}</td><td class="down">${money(-t.ch)}${t.chEst ? " <small class='muted'>est.</small>" : ""}</td><td class="${t.rs >= 0 ? "up" : "down"}"><b>${money(t.rs)}</b></td><td style="text-align:left">${t.brokers}</td>` : `<td class="${t.rs >= 0 ? "up" : "down"}">${money(t.rs)}</td>`}
      <td class="muted" style="text-align:left;white-space:normal">${(J.notes[t.id] || "").replace(/</g, "&lt;")}</td></tr>`).join("")
    || `<tr><td class="muted" colspan="${mode() !== "paper" ? 12 : 9}">${mode() !== "paper" ? "No live trades that day." : "No trades that day."}</td></tr>`}</tbody></table></div>`;
}

$("cal").addEventListener("click", e => { const d = e.target.closest(".day[data-d]"); if (!d) return; sel = d.dataset.d; render(); $("cal").querySelector(`[data-d="${sel}"]`)?.focus({preventScroll:true}); });
$("prev").addEventListener("click", () => { cur.setMonth(cur.getMonth() - 1); sel = null; load(); });
$("next").addEventListener("click", () => { cur.setMonth(cur.getMonth() + 1); sel = null; load(); });
$("strat").addEventListener("change", render);
$("mode").addEventListener("change", render);
load();
</script>
</body>
</html>
