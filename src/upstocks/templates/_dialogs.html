<dialog id="ui-confirm" class="confirm-dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <div class="confirm-content">
    <div class="confirm-top"><span class="confirm-symbol" aria-hidden="true">{{ icon('<path d="m12 3 9 4v5c0 5-9 9-9 9s-9-4-9-9V7l9-4Z"/><path d="M12 8v5m0 3h.01"/>') }}</span><button class="confirm-close" type="button" id="confirm-close" aria-label="Close confirmation">{{ icon('<path d="m6 6 12 12M6 18 18 6"/>') }}</button></div>
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <dl class="confirm-facts" id="confirm-facts" hidden></dl>
  </div>
  <div class="confirm-actions"><button class="btn ghost" type="button" id="confirm-cancel" autofocus>Cancel</button><button class="btn primary" type="button" id="confirm-accept">Continue</button></div>
</dialog>
<div class="toast" id="ui-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
  <span class="toast-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="toast-symbol-path" d="m5 12 4 4L19 6"/></svg></span>
  <span id="toast-message"></span>
  <button class="toast-close" id="toast-close" type="button" aria-label="Dismiss notification">{{ icon('<path d="m6 6 12 12M6 18 18 6"/>') }}</button>
</div>
<script>
(() => {
  const dialog = document.getElementById('ui-confirm');
  const cancel = document.getElementById('confirm-cancel');
  const accept = document.getElementById('confirm-accept');
  let pending = null;
  window.confirmUI = ({title, message, confirmText = 'Continue', danger = false, facts = []}) => {
    // Never stack confirmations or accidentally approve a second action.
    if (pending) return Promise.resolve(false);
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    accept.textContent = confirmText;
    dialog.classList.toggle('danger', danger);
    const list = document.getElementById('confirm-facts');
    list.replaceChildren();
    for (const [label, value] of facts) {
      const row = document.createElement('div');
      const term = document.createElement('dt'), detail = document.createElement('dd');
      term.textContent = label; detail.textContent = value;
      row.append(term, detail); list.append(row);
    }
    list.hidden = !facts.length;
    dialog.returnValue = 'cancel';
    return new Promise(resolve => {
      pending = {resolve, trigger:document.activeElement};
      dialog.showModal();
      cancel.focus({preventScroll:true});
    });
  };
  const dismiss = () => dialog.close('cancel');
  cancel.addEventListener('click', dismiss);
  document.getElementById('confirm-close').addEventListener('click', dismiss);
  accept.addEventListener('click', () => dialog.close('confirm'));
  dialog.addEventListener('cancel', event => { event.preventDefault(); dismiss(); });
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dismiss();
  });
  dialog.addEventListener('close', () => {
    if (!pending) return;
    const {resolve, trigger} = pending;
    pending = null;
    if (trigger?.isConnected) trigger.focus({preventScroll:true});
    resolve(dialog.returnValue === 'confirm');
  });
  let timer;
  const toast = document.getElementById('ui-toast');
  const hideToast = () => { clearTimeout(timer); toast.hidden = true; };
  window.notifyUI = (message, error = false) => {
    document.getElementById('toast-message').textContent = message;
    document.getElementById('toast-symbol-path').setAttribute('d', error ? 'M12 8v5m0 3h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z' : 'm5 12 4 4L19 6');
    toast.classList.toggle('error', error); toast.hidden = false;
    clearTimeout(timer); timer = setTimeout(hideToast, error ? 9000 : 4500);
  };
  document.getElementById('toast-close').addEventListener('click', hideToast);
})();
</script>
