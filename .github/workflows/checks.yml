name: checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run python -m unittest discover -s tests
      - run: node --test tests/test_reporting.cjs
